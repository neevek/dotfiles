general.import = ["/Users/neevek/.config/alacritty/alacritty-theme/themes/hyper.toml"]

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#000000"
foreground = "#aaaaaa"

[font]
builtin_box_drawing = true
size = 14

[font.normal]
family = "ZedMono Nerd Font Mono"

[font.offset]
y = 1
x = 0

[font.bold]
# family = "Lekton Nerd Font Mono"
family = "ZedMono Nerd Font Mono"

[font.italic]
style = "Italic"
# family = "Lekton Nerd Font Mono"
family = "ZedMono Nerd Font Mono"

[scrolling]
history = 50000

[window]
startup_mode = "Maximized"

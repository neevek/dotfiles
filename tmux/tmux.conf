set -g default-terminal "xterm-256color"

# tmux2k requires Bash 5.2+; prefer Homebrew without hiding user tools such as fzf.
# Keep this idempotent so reloading the config does not repeatedly grow PATH.
if-shell -F '#{m:/opt/homebrew/bin:*,#{E:PATH}}' '' \
  'set-environment -gF PATH "/opt/homebrew/bin:/usr/local/bin:#{E:PATH}"'

set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# To copy, left click and drag to highlight text in yellow,
# once you release left click yellow text will disappear and will automatically be available in clibboard

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Open a large popup with Prefix-P
bind-key P display-popup -w 88% -h 88% -E -d "#{pane_current_path}"
bind-key o run-shell -b "~/.config/tmux/tmux-pane-switcher.sh"

bind-key L display-popup -E "bash -lc '
fmt=\"#\"\"{pane_id} #\"\"{history_size}\"
tmux list-panes -a -F \"\$fmt\" |
awk \"\\\$2 > 5000\" |
while read -r id n; do
  tmux clear-history -t \"\$id\"
  echo \"cleared \$id (\$n lines)\"
done
read -n1 -s -r -p \"Press any key to close...\"
'"

set -sg escape-time 10

unbind-key C-b
set-option -g prefix C-x
bind-key C-x send-prefix
set -g history-limit 1000000
set -g set-titles on
setw -g mouse on

#https://github.com/LunarVim/LunarVim/i ssues/1857#issuecomment-1095203471 set -sg escape-time 10
bind ";" split-window -v -c "#{pane_current_path}"
bind "'" split-window -h -c "#{pane_current_path}"
bind "c" new-window -c "#{pane_current_path}" -t :

# pane navigation
bind -r h select-pane -L # move left
bind -r j select-pane -D # move down
bind -r k select-pane -U # move up
bind -r l select-pane -R # move right

# save tmux sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'
# save neovim sessions
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes '~nvim->nvim'
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
# Autosave every 30 minutes (set to 0 to disable).
set -g @continuum-save-interval '30'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin '2kabhishek/tmux2k'
set -g @tmux2k-theme 'default'
set -g @tmux2k-window-list-compact true
set -g @tmux2k-window-list-alignment 'left'
# No battery plugin: this host has none, so it renders a missing-battery icon, a bare
# `%`, and a shell error on every refresh.
set -g @tmux2k-left-plugins "uptime"
set -g @tmux2k-window-list-format '#I:#W'
# Load continuum after the theme so its status-bar timer survives theme setup.
set -g @plugin 'tmux-plugins/tmux-continuum'

# put this line at the end
run '~/.config/tmux/plugins/tpm/tpm'

# override window formats with AI-aware tab colors (after tpm so tmux2k doesn't clobber)
run-shell '~/.config/tmux/tmux-ai-colors.sh'

# Gate the shell job in tmux itself: 100 ms animation redraws do not launch scans.
# t/d gives the age of the last poll in seconds; the script also guards rapid calls.
set -g status-right ''
set -ga status-right '#{?#{?@ai_status_last_poll,#{e|>=:#{t/d:@ai_status_last_poll},5},1},#(~/.config/tmux/tmux-ai-status.sh),}'

# Visiting a window acknowledges its completion immediately, including by mouse.
set-hook -g session-window-changed[90] 'set-option -wu @ai_finished'
set-hook -g client-session-changed[90] 'set-option -wu @ai_finished'

# add the following line to the end of .zshrc
# [ -z "$TMUX"  ] && { tmux attach || exec tmux new-session;}

# Modified keys (Shift+Enter etc.) for apps such as pi
set -g extended-keys on
set -g extended-keys-format csi-u

# The AI status override above replaces status-right. Reattach continuum's timer
# last, including on config reloads. The plugin avoids adding duplicate timers.
run-shell '~/.config/tmux/plugins/tmux-continuum/continuum.tmux 2>/dev/null'
